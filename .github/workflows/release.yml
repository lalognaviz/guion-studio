name: Release GuionStudio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # 1. Clonar el repositorio (clone shallow, depth 1 por defecto)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js v22 LTS (jsdom/vitest requieren >=20.19)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 4. Configurar Go (versión mínima declarada en go.mod)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 5. Verificaciones antes de compilar
      - name: Frontend tests (Vitest)
        run: npm test
        working-directory: frontend

      - name: Typecheck (tsc)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Backend tests (Go)
        run: go test ./...

      # 6. Instalar el CLI de Wails (misma versión declarada en go.mod)
      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)

      # 6b. Gate de bindings: generar y verificar que frontend/wailsjs esté sincronizado
      - name: Check bindings are in sync
        shell: bash
        run: |
          wails generate module
          if [ -n "$(git status --porcelain -- frontend/wailsjs)" ]; then
            echo "::error::frontend/wailsjs stale — run 'wails generate module' and commit"
            git status --porcelain -- frontend/wailsjs
            git diff -- frontend/wailsjs
            exit 1
          fi

      # 7. Asegurar NSIS instalado (evita build sin instalador)
      - name: Ensure NSIS
        shell: powershell
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $nsisDir = "C:\Program Files (x86)\NSIS"
            if (Test-Path (Join-Path $nsisDir "makensis.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
              Write-Host "NSIS instalado y agregado al PATH para los pasos siguientes"
            }
          } else {
            Write-Host "makensis already installed"
          }

      # 7b. Verificar que makensis ejecute de verdad (Wails solo emite un warning si falta)
      - name: Verify makensis
        shell: powershell
        run: |
          $cmd = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Host "::error::makensis no disponible en PATH; no se generará el instalador NSIS"
            exit 1
          }
          & $cmd.Source /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makensis falló al ejecutarse (exit $LASTEXITCODE)"
            exit 1
          }

      # 8. Compilar frontend + backend y generar el instalador NSIS
      - name: Build with Wails
        run: wails build -nsis -platform windows/amd64

      # 8b. Exigir ambos artefactos: Wails NO falla si makensis falta (solo avisa),
      #      y el glob del upload seguiría matcheando el .exe portable.
      - name: Verify release artifacts
        shell: powershell
        run: |
          $required = @(
            "build/bin/guion-studio.exe",
            "build/bin/guion-studio-amd64-installer.exe"
          )
          $failed = $false
          foreach ($f in $required) {
            if (Test-Path $f) {
              Write-Host "OK  $f"
            } else {
              Write-Host "::error::Falta el artefacto: $f"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # 9. Adjuntar ejecutable portable e instalador a la Release (borrador)
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'GuionStudio ${{ github.ref_name }}'
          draft: true
          body: |
            ## 🎬 GuionStudio ${{ github.ref_name }}

            Descarga el instalador para tu sistema:
            - **`guion-studio-amd64-installer.exe`** — Instalador NSIS (recomendado para usuarios finales)
            - **`guion-studio.exe`** — Ejecutable portable (sin instalación requerida)

            Requiere el [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) (incluido en Windows 10/11).

            ---
            *Compilado automáticamente desde el tag `${{ github.ref_name }}`.*
          files: |
            build/bin/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
