name: Release GuionStudio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Clonar el repositorio con historial completo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js v22 LTS (jsdom/vitest requieren >=20.19)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 4. Configurar Go (versión mínima declarada en go.mod)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 5. Verificaciones antes de compilar
      - name: Frontend tests (Vitest)
        run: npm test
        working-directory: frontend

      - name: Typecheck (tsc)
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Backend tests (Go)
        run: go test ./...

      # 6. Instalar el CLI de Wails (misma versión que go.mod)
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # 6b. Asegurar que GOPATH/bin esté en PATH
      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      # 6c. Gate de bindings: generar y verificar que frontend/wailsjs esté sincronizado
      - name: Check bindings are in sync
        shell: bash
        run: |
          wails generate module
          if [ -n "$(git status --porcelain -- frontend/wailsjs)" ]; then
            echo "::error::frontend/wailsjs stale — run 'wails generate module' and commit"
            git status --porcelain -- frontend/wailsjs
            git diff -- frontend/wailsjs
            exit 1
          fi

      # 6d. Asegurar NSIS instalado (evita build sin instalador)
      - name: Ensure NSIS
        shell: powershell
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          } else {
            Write-Host "makensis already installed"
          }

      # 7. Compilar frontend + backend y generar el instalador NSIS
      - name: Build with Wails
        run: wails build -nsis -platform windows/amd64

      # 8. Adjuntar ejecutable portable e instalador a la Release
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'GuionStudio ${{ github.ref_name }}'
          body: |
            ## 🎬 GuionStudio ${{ github.ref_name }}

            Descarga el instalador para tu sistema:
            - **`guion-studio-amd64-installer.exe`** — Instalador NSIS (recomendado para usuarios finales)
            - **`guion-studio.exe`** — Ejecutable portable (sin instalación requerida)

            Requiere el [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) (incluido en Windows 10/11).

            ---
            *Compilado automáticamente desde el tag `${{ github.ref_name }}`.*
          files: |
            build/bin/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
