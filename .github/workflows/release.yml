name: Release GuionStudio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Clonar el repositorio con historial completo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js v22 LTS
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        run: npm ci

      # 4. Configurar Rust toolchain estable
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 5. Caché de dependencias Rust (acelera compilaciones futuras ~5x)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 6. Compilar frontend + backend Tauri y crear la Release con instaladores
      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'GuionStudio ${{ github.ref_name }}'
          releaseBody: |
            ## 🎬 GuionStudio ${{ github.ref_name }}

            Descarga el instalador para tu sistema:
            - **`*-setup.exe`** — Instalador NSIS (recomendado para usuarios finales)
            - **`*.msi`** — Instalador MSI (para despliegue empresarial / Group Policy)
            - **`guion-studio.exe`** — Ejecutable portable (sin instalación requerida)

            ---
            *Compilado automáticamente desde el tag `${{ github.ref_name }}`.*
          releaseDraft: false
          prerelease: false

      # 7. Adjuntar el ejecutable portable a la misma Release
      - name: Upload portable executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/guion-studio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
